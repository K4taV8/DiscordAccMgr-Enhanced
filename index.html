<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    CSP : img-src autorise deja cdn.discordapp.com pour les photos, media-src
    fait la meme chose pour les videos et l'audio. Sans lui, la directive media
    retombe sur default-src 'self', refuse le CDN, et chaque <video> reste un
    rectangle noir avec une barre de lecture inerte, le fond du CSS masquant
    l echec. Le miroir telecharge une copie locale servie par le protocole
    media: ; img-src et media-src doivent donc aussi autoriser ce schema, sinon
    la copie est refusee au chargement comme le CDN l'etait avant. connect-src
    reste 'self' : le renderer ne peut donc toujours pas fetch le CDN. Le README
    (lignes 269-270, invariants S3/S4) documente script-src 'self' et
    connect-src 'self' comme zones rouges ; aucun des deux n est touche ici.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com media:; media-src 'self' https://cdn.discordapp.com media:; connect-src 'self'">
  <title>Discord Account Manager - Enhanced Forked By KataV8</title>
  <link rel="stylesheet" href="src/styles/app.css">
</head>
<body>
  <div class="app-container">
    <div class="title-bar">
      <div class="title">
        Discord Account Manager - Enhanced Forked By KataV8
      </div>
      <div class="window-controls">
        <button class="info-button" id="infoBtn">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
        </button>
        <button id="minimizeBtn">
          <svg viewBox="0 0 12 12">
            <rect width="10" height="1" x="1" y="6" stroke="currentColor"></rect>
          </svg>
        </button>
        <button id="maximizeBtn">
          <svg viewBox="0 0 12 12">
            <rect width="9" height="9" x="1.5" y="1.5" fill="none" stroke="currentColor"></rect>
          </svg>
        </button>
        <button id="closeBtn">
          <svg viewBox="0 0 12 12">
            <line x1="1" y1="1" x2="11" y2="11" stroke="currentColor" stroke-width="1"/>
            <line x1="1" y1="11" x2="11" y2="1" stroke="currentColor" stroke-width="1"/>
          </svg>
        </button>        
      </div>
    </div>

    <div class="main-wrapper">
      <!-- Navigation Sidebar -->
      <nav class="nav-sidebar">
        <div class="nav-items">
          <div class="nav-item active" data-page="login" id="loginNavItem" data-tooltip="Connexion" aria-label="Connexion">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13 12H3"/>
            </svg>
          </div>
          <div class="nav-item hidden" data-page="friends" data-tooltip="Friends" aria-label="Friends">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 13H8c-2.76 0-5 2.24-5 5v1c0 .55.45 1 1 1h10c.55 0 1-.45 1-1v-1c0-2.76-2.24-5-5-5m-5 5c0-1.65 1.35-3 3-3h2c1.65 0 3 1.35 3 3zm7.73-11.49c-.08-.22-.19-.42-.3-.62v-.01c-.69-1.14-1.93-1.89-3.42-1.89-2.28 0-4 1.72-4 4s1.72 4 4 4c1.49 0 2.73-.74 3.42-1.89v-.01c.12-.2.22-.4.3-.62.02-.06.03-.12.05-.18.06-.17.11-.34.15-.52.05-.25.07-.51.07-.78s-.03-.53-.07-.78c-.03-.18-.09-.35-.15-.52-.02-.06-.03-.12-.05-.18M9 10c-1.18 0-2-.82-2-2s.82-2 2-2 2 .82 2 2-.82 2-2 2m6 0q-.165 0-.33-.03c-.22.66-.56 1.27-.98 1.81.41.13.84.22 1.31.22 2.28 0 4-1.72 4-4s-1.72-4-4-4c-.47 0-.9.09-1.31.22.43.53.76 1.14.98 1.81.11-.01.21-.03.33-.03 1.18 0 2 .82 2 2s-.82 2-2 2m1 3h-1.11c.6.58 1.08 1.27 1.44 2.03C17.83 15.2 19 16.46 19 18h-2v1c0 .35-.07.69-.18 1H20c.55 0 1-.45 1-1v-1c0-2.76-2.24-5-5-5"/>
            </svg>
          </div>
          <div class="nav-item hidden" data-page="servers" data-tooltip="Servers" aria-label="Servers">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 14v2h3.73l-.72 3.82 1.97.37.78-4.18h4.96L13 19.83l1.97.37.78-4.18h4.23v-2h-3.86l.75-4h4.11v-2h-3.73l.72-3.82L16 3.83l-.78 4.18h-4.96l.72-3.82-1.97-.37L8.23 8H4v2h3.86l-.75 4zm6.89-4h4.96l-.75 4H9.14z"/>
            </svg>
          </div>
          <div class="nav-item hidden" data-page="dms" data-tooltip="DMs" aria-label="DMs">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 19h3v2c0 .36.19.69.51.87.15.09.32.13.49.13s.36-.05.51-.14L13.27 19h6.72c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2"/>
            </svg>
          </div>
          <div class="nav-item hidden" data-page="groups" data-tooltip="Groups" aria-label="Groups">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 5a3 3 0 1 0 0 6 3 3 0 1 0 0-6m1 7h-2c-2.76 0-5 2.24-5 5v.5c0 .83.67 1.5 1.5 1.5h9c.83 0 1.5-.67 1.5-1.5V17c0-2.76-2.24-5-5-5m-6.5-1c.47 0 .9-.12 1.27-.33a5.03 5.03 0 0 1-.42-4.52C7.09 6.06 6.8 6 6.5 6 5.06 6 4 7.06 4 8.5S5.06 11 6.5 11m-.39 1H5.5C3.57 12 2 13.57 2 15.5v1c0 .28.22.5.5.5H4c0-1.96.81-3.73 2.11-5m11.39-1c1.44 0 2.5-1.06 2.5-2.5S18.94 6 17.5 6c-.31 0-.59.06-.85.15a5.03 5.03 0 0 1-.42 4.52c.37.21.79.33 1.27.33m1 1h-.61A6.97 6.97 0 0 1 20 17h1.5c.28 0 .5-.22.5-.5v-1c0-1.93-1.57-3.5-3.5-3.5"/>
            </svg>
          </div>
          <div class="nav-item hidden" data-page="package" data-tooltip="Package Archive" aria-label="Package Archive">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 7.5 12 3 4 7.5v9L12 21l8-4.5zM12 5.3l5.7 3.2L12 11.7 6.3 8.5zM6 10.2l5 2.8v5.4l-5-2.8zm7 8.2V13l5-2.8v5.4z"/>
            </svg>
          </div>
        </div>

        <!-- User Profile -->
        <div class="user-profile" id="userProfile">
          <button class="nav-item theme-toggle" id="themeToggleBtn" data-tooltip="Changer de thème" aria-label="Changer de thème" aria-haspopup="true" aria-expanded="false" title="Changer de thème"></button>
          <button class="nav-item help-btn" id="helpBtn" data-tooltip="Aide" aria-label="Aide" title="Aide">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
          </button>
          <div class="nav-item nav-avatar-box" id="userAvatarBtn" data-tooltip="Profile" aria-label="Profile">
            <div class="user-avatar">
              <span id="userInitial"></span>
            </div>
          </div>
          <button class="nav-item nav-disconnect" id="disconnectBtn" data-tooltip="Disconnect" aria-label="Disconnect" title="Disconnect">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
          </button>
        </div>
      </nav>

      <!-- Main Content Area -->
      <div class="main-content">
        <!-- Login Page -->
        <div class="page-container active" id="login-page">
          <div class="login-container">
            <div class="login-box">
              <div class="login-logo">
                <svg width="26" height="26" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 21c2.76 0 5-2.24 5-5 0-1.02-.31-1.96-.83-2.75l3.33-3.33 1.79 1.79 1.41-1.41-1.79-1.79L18 7.42l2.29 2.29L21.7 8.3l-2.29-2.29 1.29-1.29-1.41-1.41-8.54 8.54c-.79-.52-1.74-.83-2.75-.83-2.76 0-5 2.24-5 5s2.24 5 5 5Zm0-8c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3"></path></svg>
              </div>
              <h1>Bon retour</h1>
              <div class="input-group">
                <div class="token-field">
                  <input type="password" id="tokenInput" placeholder="ex. mfa.Vkd_qX... (Collez votre token)">
                  <button id="toggleTokenBtn" class="btn btn-secondary" title="Afficher">
                    <svg id="eyeOpenIcon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 1 0 0-6"></path><path d="M12 19c7.63 0 9.93-6.62 9.95-6.68.07-.21.07-.43 0-.63-.02-.07-2.32-6.68-9.95-6.68s-9.93 6.61-9.95 6.67c-.07.21-.07.43 0 .63.02.07 2.32 6.68 9.95 6.68Zm0-12c5.35 0 7.42 3.85 7.93 5-.5 1.16-2.58 5-7.93 5s-7.42-3.84-7.93-5c.5-1.16 2.58-5 7.93-5"></path></svg>
                    <svg id="eyeClosedIcon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none"><path d="m21.95 12.32-1.9-.64C19.98 11.9 18.16 17 12 17s-7.98-5.1-8.05-5.32l-1.9.63s.28.8.93 1.81L.7 15.85l1.21 1.6 2.3-1.74c.58.62 1.29 1.24 2.16 1.77l-1.51 2.48L6.57 21l1.62-2.65c.83.3 1.78.5 2.82.59v3.05h2v-3.05c1.05-.08 1.99-.29 2.82-.59L17.45 21l1.71-1.04-1.51-2.48c.87-.53 1.58-1.15 2.16-1.77l2.3 1.74 1.21-1.6-2.28-1.73c.65-1.01.92-1.79.93-1.81Z"></path></svg>
                  </button>
                </div>
              </div>
              <div class="button-group">
                <button id="connectBtn" class="btn btn-primary">
                  <span class="btn-text">Se connecter</span>
                  <div class="loader" style="display: none;"></div>
                </button>
                <button id="saveTokenBtn" class="btn btn-secondary">Enregistrer</button>
                <button type="button" id="discordLoginBtn" class="btn btn-discord"><svg viewBox="0 0 127.14 96.36" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg><span>Connexion avec Discord</span></button>
              </div>
              <div id="status"></div>
              <div class="login-divider"></div>
              <div class="token-management" id="tokenManagement"></div>
            </div>
          </div>
        </div>

        <!-- Friends Page -->
        <div class="page-container" id="friends-page"></div>

        <!-- Servers Page -->
        <div class="page-container" id="servers-page"></div>

        <!-- DMs Page -->
        <div class="page-container" id="dms-page"></div>

        <!-- Groups Page -->
        <div class="page-container" id="groups-page"></div>

        <!-- Package Archive Page -->
        <div class="page-container" id="package-page"></div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
