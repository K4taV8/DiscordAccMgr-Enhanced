<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    CSP : img-src autorise deja cdn.discordapp.com pour les photos, media-src
    fait la meme chose pour les videos et l'audio. Sans lui, la directive media
    retombe sur default-src 'self', refuse le CDN, et chaque <video> reste un
    rectangle noir avec une barre de lecture inerte, le fond du CSS masquant
    l echec. Le miroir telecharge une copie locale servie par le protocole
    media: ; img-src et media-src doivent donc aussi autoriser ce schema, sinon
    la copie est refusee au chargement comme le CDN l'etait avant. connect-src
    reste 'self' : le renderer ne peut donc toujours pas fetch le CDN. Le README
    (lignes 269-270, invariants S3/S4) documente script-src 'self' et
    connect-src 'self' comme zones rouges ; aucun des deux n est touche ici.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com media:; media-src 'self' https://cdn.discordapp.com media:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Discord Account Manager - Enhanced</title>
  <link rel="stylesheet" href="src/styles/app.css">
</head>
<body>
  <div class="app-container">
    <header class="titlebar" id="titlebar">
      <div class="titlebar-drag" id="titlebar-drag">
        <div class="titlebar-logo">
          <img src="assets/logo.png" width="18" height="18" alt="" draggable="false">
          <span class="titlebar-name">Discord Account Manager - Enhanced</span>
        </div>
      </div>

      <div class="titlebar-buttons">
        <button class="tb-btn" id="settingsBtn" type="button" title="Informations" aria-label="Informations">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M11 11h2v6h-2zm0-4h2v2h-2z"/>
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2m0 16H5V5h14z"/>
          </svg>
        </button>

        <button class="tb-btn" id="minimizeBtn" type="button" title="Réduire" aria-label="Réduire">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>

        <button class="tb-btn" id="maximizeBtn" type="button" title="Agrandir / restaurer" aria-label="Agrandir / restaurer">
          <svg class="icon-max" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          <svg class="icon-restore" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <rect x="4" y="2.5" width="5.5" height="5.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <path d="M6.5 4H2.5v5.5H8V6.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </button>

        <button class="tb-btn tb-close" id="closeBtn" type="button" title="Fermer la fenêtre" aria-label="Fermer la fenêtre">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <line x1="2.5" y1="2.5" x2="9.5" y2="9.5" stroke="currentColor" stroke-width="1.5"/>
            <line x1="9.5" y1="2.5" x2="2.5" y2="9.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="main-wrapper">
      <!-- Navigation Sidebar -->
      <nav class="nav-sidebar">
        <div class="nav-items">
          <div class="nav-item active" data-page="login" id="loginNavItem" data-tooltip="Connexion" aria-label="Connexion">
            <span class="icon icon-24 icon-login" aria-hidden="true"></span>
          </div>
          <div class="nav-item hidden" data-page="friends" data-tooltip="Amis" aria-label="Amis">
            <span class="icon icon-24 icon-group" aria-hidden="true"></span>
          </div>
          <div class="nav-item hidden" data-page="servers" data-tooltip="Serveurs" aria-label="Serveurs">
            <span class="icon icon-24 icon-hashtag" aria-hidden="true"></span>
          </div>
          <div class="nav-item hidden" data-page="dms" data-tooltip="MP" aria-label="MP">
            <span class="icon icon-24 icon-discussion" aria-hidden="true"></span>
          </div>
          <div class="nav-item hidden" data-page="groups" data-tooltip="Groupes" aria-label="Groupes">
            <span class="icon icon-24 icon-community" aria-hidden="true"></span>
          </div>
          <div class="nav-item hidden" data-page="package" data-tooltip="Archive de données" aria-label="Archive de données">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 7.5 12 3 4 7.5v9L12 21l8-4.5zM12 5.3l5.7 3.2L12 11.7 6.3 8.5zM6 10.2l5 2.8v5.4l-5-2.8zm7 8.2V13l5-2.8v5.4z"/>
            </svg>
          </div>
        </div>

        <!-- User Profile -->
        <div class="user-profile" id="userProfile">
          <button class="nav-item language-btn" id="languageBtnRail" data-tooltip="Langue" aria-label="Langue" title="Langue">
            <span class="icon icon-24 icon-translate" aria-hidden="true"></span>
          </button>
          <button class="nav-item theme-toggle" id="themeToggleBtn" data-tooltip="Changer de thème" aria-label="Changer de thème" aria-haspopup="true" aria-expanded="false" title="Changer de thème"></button>
          <button class="nav-item help-btn" id="helpBtn" data-tooltip="Aide" aria-label="Aide" title="Aide">
            <span class="icon icon-18 icon-help" aria-hidden="true"></span>
          </button>
          <div class="nav-item nav-avatar-box" id="userAvatarBtn" data-tooltip="Profil" aria-label="Profil">
            <div class="user-avatar">
              <span id="userInitial"></span>
            </div>
          </div>
          <button class="nav-item nav-disconnect" id="disconnectBtn" data-tooltip="Déconnexion" aria-label="Déconnexion" title="Déconnexion">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
          </button>
        </div>
      </nav>

      <!-- Main Content Area -->
      <div class="main-content">
        <!-- Login Page -->
        <div class="page-container active" id="login-page">
          <div class="login-container">
            <div class="login-box">
              <button type="button" id="languageBtnLogin" class="language-pill" title="Langue" aria-label="Langue">
                <span class="icon icon-16 icon-translate" aria-hidden="true"></span>
                <span class="language-code">FR</span>
              </button>
              <div class="login-logo">
                <span class="icon icon-26 icon-key" aria-hidden="true"></span>
              </div>
              <h1>Bon retour</h1>
              <div class="input-group">
                <div class="token-field">
                  <input type="password" id="tokenInput" placeholder="ex. mfa.Vkd_qX... (Collez votre token)">
                  <button id="toggleTokenBtn" class="btn btn-secondary" title="Afficher">
                    <span class="icon icon-16 icon-eye" id="eyeOpenIcon" aria-hidden="true"></span>
                    <span class="icon icon-16 icon-eye-closed" id="eyeClosedIcon" aria-hidden="true" style="display:none"></span>
                  </button>
                </div>
              </div>
              <div class="button-group">
                <button id="connectBtn" class="btn btn-primary">
                  <span class="btn-text">Se connecter</span>
                  <div class="loader" style="display: none;"></div>
                </button>
                <button id="saveTokenBtn" class="btn btn-secondary">Enregistrer</button>
                <button type="button" id="discordLoginBtn" class="btn btn-discord"><span class="icon icon-18 icon-discord" aria-hidden="true"></span><span>Connexion avec Discord</span></button>
              </div>
              <div id="status"></div>
              <div class="login-divider"></div>
              <div class="token-management" id="tokenManagement"></div>
            </div>
          </div>
        </div>

        <!-- Friends Page -->
        <div class="page-container" id="friends-page"></div>

        <!-- Servers Page -->
        <div class="page-container" id="servers-page"></div>

        <!-- DMs Page -->
        <div class="page-container" id="dms-page"></div>

        <!-- Groups Page -->
        <div class="page-container" id="groups-page"></div>

        <!-- Package Archive Page -->
        <div class="page-container" id="package-page"></div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
